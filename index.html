<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Network+ Day 15 Cyber Incident Simulator</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    body { background-color: #0d1117; color: #c9d1d9; font-family: 'Courier New', monospace; margin: 0; padding: 20px; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #30363d; padding-bottom: 10px; margin-bottom: 20px; }
    .container { display: flex; gap: 20px; }
    .main-panel { flex: 3; border: 1px solid #30363d; padding: 25px; border-radius: 8px; background: #161b22; position: relative; }
    .side-panel { flex: 1; border: 1px solid #30363d; padding: 20px; border-radius: 8px; background: #161b22; }
    h1, h2, h3 { color: #f0f6fc; margin-top: 0; }
    .terminal { background: #000; color: #39ff14; padding: 20px; border-radius: 6px; font-size: 1.15em; white-space: pre-wrap; line-height: 1.5; border: 1px solid #238636; }
    .btn { background: #238636; color: white; border: none; padding: 12px 24px; font-size: 1.1rem; cursor: pointer; border-radius: 6px; font-weight: bold; font-family: inherit; }
    .btn:hover { background: #2ea043; }
    .alert-banner { background: #d29922; color: #000; padding: 12px; font-weight: bold; font-size: 1.2rem; border-radius: 6px; margin-bottom: 15px; text-align: center; display: none; }
    .player-list { list-style: none; padding: 0; margin: 0; max-height: 400px; overflow-y: auto; }
    .player-list li { background: #21262d; margin: 6px 0; padding: 10px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }
    .status-dot { height: 10px; width: 10px; border-radius: 50%; display: inline-block; background-color: #484f58; }
    .status-dot.answered { background-color: #39ff14; box-shadow: 0 0 8px #39ff14; }
    .qr-large { width: 240px; height: 240px; display: block; margin: 20px auto; border: 4px solid #30363d; border-radius: 8px; }
    .qr-small { width: 90px; height: 90px; border: 2px solid #30363d; border-radius: 4px; }
    .counter-box { font-size: 1.4rem; color: #58a6ff; font-weight: bold; margin-bottom: 15px; }
    .correct-highlight { background: #1f6feb; color: white; padding: 10px; border-radius: 4px; margin-top: 15px; font-weight: bold; }
  </style>
</head>
<body>

  <div class="header-bar">
    <div>
      <h1>[S-6 INCIDENT COMMAND] Network+ N10-009 Review</h1>
      <div id="phase-tag" style="color: #8b949e; font-weight: bold;">STATUS: LOBBY IN PROGRESS</div>
    </div>
    <div id="mini-qr-container" style="display:none; text-align: center;">
      <img id="qr-mini" class="qr-small" src="" alt="QR">
      <div style="font-size: 0.7rem; color: #8b949e;">SCAN TO JOIN</div>
    </div>
  </div>

  <div class="container">
    <div class="main-panel">
      <div id="alert-box" class="alert-banner">⚡ ALL STATIONS HAVE RESPONDED! READY TO REVEAL. ⚡</div>
      <div id="display-title"><h2>OP-LOBBY: Waiting for SOC Agents</h2></div>
      <div id="counter-display" class="counter-box" style="display:none;">Responses Transmitted: <span id="ans-count">0</span> / <span id="total-count">0</span></div>
      <div id="display-body" class="terminal">Scan the QR code to log into the Tactical Terminal...</div>
      <div id="qr-lobby-box">
        <img id="qr-large" class="qr-large" src="" alt="Lobby QR">
      </div>
      <br>
      <button id="action-btn" class="btn" onclick="advanceState()">Commence Operation (Node 1 Briefing)</button>
    </div>

    <div class="side-panel">
      <h3>Active Agents (<span id="player-count">0</span>)</h3>
      <ul id="players" class="player-list"></ul>
    </div>
  </div>

  <script>
    const firebaseConfig = {
  apiKey: "AIzaSyAp-Bft2q1zwGoF6q9wMdyQkBd4BDTbnms",
  authDomain: "operation-voluntold.firebaseapp.com",
  projectId: "operation-voluntold",
  storageBucket: "operation-voluntold.firebasestorage.app",
  messagingSenderId: "373011790429",
  appId: "1:373011790429:web:a9e8af4bc05b43427c2bb4"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const mobileUrl = window.location.href.replace('index.html', '') + 'mobile.html';
    const qrSrc = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(mobileUrl)}`;
    document.getElementById('qr-large').src = qrSrc;
    document.getElementById('qr-mini').src = qrSrc;

    const gameData = [
      {
        nodeKey: "NODE_1",
        title: "NODE 1: The 0300 Voluntold Shift",
        story: "OPERATION BANNER BADGER: You were voluntold to cover the graveyard shift at the SOC because you made eye contact with the Chief. Suddenly, an external host starts probing port responses to identify OS versions and active services[cite: 1]. The commander demands to know what's happening before his morning coffee runs out.",
        question: "TERMINAL PROMPT: Which phase of enumeration is actively targeting specific system/software versions[cite: 1]?\n\n[A] Footprinting\n[B] Fingerprinting\n[C] Dumpster Diving\n[D] Tailgating",
        correct: "B",
        explanation: "DEBRIEF: Fingerprinting specifically probes open ports and system responses to identify OS and software version numbers[cite: 1]. Footprinting maps out the broader network topology[cite: 1]."
      },
      {
        nodeKey: "NODE_2",
        title: "NODE 2: Mandatory Fun Under Attack",
        story: "DEFCON 3: While the unit is trapped in a mandatory briefing, the edge firewall starts screaming. Multiple external threat actors are spamming TCP SYN packets, exhausting server connection queues and knocking services offline[cite: 1]. The CO is threatening to cancel weekend liberty if email goes down.",
        question: "INCIDENT: What type of attack vector is currently saturating the perimeter[cite: 1]?\n\n[A] On-Path Attack\n[B] Distributed Denial of Service (DDoS)\n[C] MAC Flooding\n[D] ARP Spoofing",
        correct: "B",
        explanation: "DEBRIEF: A DDoS attack uses multiple external systems to flood bandwidth or exhaust server connection pools (like SYN floods)[cite: 1]."
      },
      {
        nodeKey: "NODE_3",
        title: "NODE 3: The 'I Brought My Own Router' Incident",
        story: "SELF-INFLICTED WOUND: A private plugged an unauthorized wireless router bought from the local PX into the wall jack to bypass network filters[cite: 1]. Now workstations across the building are throwing duplicate IP errors[cite: 1].",
        question: "TERMINAL PROMPT: What automatic feature caused client workstations to assign themselves 169.254.x.x addresses when the rogue router disrupted DHCP pool distribution[cite: 1]?\n\n[A] APIPA\n[B] DNSSEC\n[C] Kerberos\n[D] TACACS+",
        correct: "A",
        explanation: "DEBRIEF: Automatic Private IP Addressing (APIPA) assigns a 169.254.0.0/16 address when a device cannot contact a valid DHCP server[cite: 1]."
      },
      {
        nodeKey: "NODE_4",
        title: "NODE 4: Core Switch Meltdown",
        story: "S-6 EMERGENCY: An attacker is hammering the core switch with thousands of fake source MAC addresses per second, completely filling the CAM table[cite: 1]. Your $20,000 enterprise switch just panicked and defaulted into acting like a cheap, unmanaged hub[cite: 1].",
        question: "INCIDENT: What layer 2 attack just turned your secure network into a free-for-all broadcast party[cite: 1]?\n\n[A] VLAN Hopping\n[B] MAC Flooding\n[C] Double Tagging\n[D] Deauthentication Attack",
        correct: "B",
        explanation: "DEBRIEF: MAC Flooding overloads the switch CAM table with spoofed source MAC addresses, forcing it to broadcast all incoming packets out every port like a hub[cite: 1]."
      },
      {
        nodeKey: "NODE_5",
        title: "NODE 5: Guards at the Gate",
        story: "CREDENTIAL BREACH: Adversaries are trying to bypass local authentication over an untrusted network connection[cite: 1]. They are trying to fool the 'three-headed guard dog' system to issue a Ticket Granting Ticket (TGT) without proper validation[cite: 1].",
        question: "TERMINAL PROMPT: Which secure authentication protocol uses a Key Distribution Center (KDC) to issue TGTs over untrusted networks[cite: 1]?\n\n[A] RADIUS\n[B] TACACS+\n[C] Kerberos\n[D] PAP",
        correct: "C",
        explanation: "DEBRIEF: Kerberos relies on a Key Distribution Center (KDC) to issue Ticket Granting Tickets (TGTs) for secure SSO authentication over insecure networks[cite: 1]."
      },
      {
        nodeKey: "NODE_6",
        title: "NODE 6: The Inspector General Arrives",
        story: "AFTER-ACTION REPORT: The attack is contained, but now the auditors are walking in the door with clipboards. Because payment transactions were processed on the base network during the breach, compliance officers demand proof that credit card data standards were upheld[cite: 1].",
        question: "AUDIT REQUIREMENT: Which regulatory standard specifically dictates security requirements for handling credit card data[cite: 1]?\n\n[A] GDPR\n[B] PCI DSS\n[C] HIPAA\n[D] ISO 27001",
        correct: "B",
        explanation: "DEBRIEF: Payment Card Industry Data Security Standard (PCI DSS) mandates security controls specifically for processing and storing cardholder data[cite: 1]."
      }
    ];

    let currentIdx = 0;
    let phase = "LOBBY"; // LOBBY -> NARRATIVE -> QUESTION -> REVEAL -> END
    let playersData = {};

    function updateGameState() {
      db.ref('game_state').set({
        nodeIndex: currentIdx,
        phase: phase,
        currentNodeKey: gameData[currentIdx] ? gameData[currentIdx].nodeKey : "END"
      });
    }

    function resetPlayerAnswers() {
      db.ref('players').once('value', (snapshot) => {
        const players = snapshot.val() || {};
        for (let id in players) {
          db.ref(`players/${id}/currentAnswer`).set("");
        }
      });
    }

    function advanceState() {
      const btn = document.getElementById('action-btn');
      const alertBox = document.getElementById('alert-box');
      const counterDisplay = document.getElementById('counter-display');
      const miniQr = document.getElementById('mini-qr-container');
      const lobbyQrBox = document.getElementById('qr-lobby-box');
      
      alertBox.style.display = "none";

      if (phase === "LOBBY") {
        phase = "NARRATIVE";
        miniQr.style.display = "block";
        lobbyQrBox.style.display = "none";
        resetPlayerAnswers();
        updateDisplay();
        btn.innerText = "Deploy Question";
      } else if (phase === "NARRATIVE") {
        phase = "QUESTION";
        counterDisplay.style.display = "block";
        resetPlayerAnswers();
        updateDisplay();
        btn.innerText = "Reveal Answer & Scoring";
      } else if (phase === "QUESTION") {
        phase = "REVEAL";
        counterDisplay.style.display = "none";
        calculateScores();
        updateDisplay();
        if (currentIdx < gameData.length - 1) {
          btn.innerText = "Next Narrative Node";
        } else {
          btn.innerText = "Final Incident Debrief";
        }
      } else if (phase === "REVEAL") {
        currentIdx++;
        if (currentIdx < gameData.length) {
          phase = "NARRATIVE";
          resetPlayerAnswers();
          updateDisplay();
          btn.innerText = "Deploy Question";
        } else {
          phase = "END";
          updateDisplay();
          btn.style.display = "none";
        }
      }
      updateGameState();
    }

    function calculateScores() {
      const node = gameData[currentIdx];
      db.ref('players').once('value', (snapshot) => {
        const players = snapshot.val() || {};
        for (let id in players) {
          let p = players[id];
          let currentScore = p.score !== undefined ? p.score : 100;
          if (p.currentAnswer && p.currentAnswer !== node.correct) {
            currentScore = Math.max(0, currentScore - 15);
          } else if (p.currentAnswer === node.correct) {
            currentScore += 10;
          }
          db.ref(`players/${id}/score`).set(currentScore);
        }
      });
    }

    function updateDisplay() {
      const titleBox = document.getElementById('display-title');
      const bodyBox = document.getElementById('display-body');
      const phaseTag = document.getElementById('phase-tag');
      const node = gameData[currentIdx];

      if (phase === "NARRATIVE") {
        phaseTag.innerText = `STATUS: NODE ${currentIdx + 1} BRIEFING IN PROGRESS`;
        titleBox.innerHTML = `<h2>${node.title}</h2>`;
        bodyBox.innerText = node.story;
      } else if (phase === "QUESTION") {
        phaseTag.innerText = `STATUS: NODE ${currentIdx + 1} QUESTION ACTIVE`;
        titleBox.innerHTML = `<h2>${node.title} - ENGAGEMENT</h2>`;
        bodyBox.innerText = node.question;
      } else if (phase === "REVEAL") {
        phaseTag.innerText = `STATUS: NODE ${currentIdx + 1} BATTLE DAMAGE ASSESSMENT`;
        titleBox.innerHTML = `<h2>${node.title} - ANALYSIS</h2>`;
        bodyBox.innerHTML = node.question + `<div class="correct-highlight">CORRECT OPTION: [${node.correct}]</div>\n` + node.explanation;
      } else if (phase === "END") {
        phaseTag.innerText = `STATUS: OPERATION COMPLETE`;
        titleBox.innerHTML = `<h2>INCIDENT DEBRIEF COMPLETE</h2>`;
        bodyBox.innerText = "All network threat vectors contained. Review final agent standings on the right board.";
      }
    }

    // Live player sync & response tracking
    db.ref('players').on('value', (snapshot) => {
      const playersList = document.getElementById('players');
      playersList.innerHTML = '';
      playersData = snapshot.val() || {};
      
      let total = 0;
      let answered = 0;

      for (let id in playersData) {
        total++;
        let p = playersData[id];
        if (p.currentAnswer && p.currentAnswer !== "") {
          answered++;
        }

        let li = document.createElement('li');
        let hasAnsweredClass = (p.currentAnswer && p.currentAnswer !== "") ? "answered" : "";
        li.innerHTML = `
          <div>
            <span class="status-dot ${hasAnsweredClass}"></span>
            <strong style="margin-left: 8px;">${p.name}</strong>
          </div>
          <span style="color:#58a6ff;">${p.score !== undefined ? p.score : 100} PTS</span>
        `;
        playersList.appendChild(li);
      }

      document.getElementById('player-count').innerText = total;
      document.getElementById('ans-count').innerText = answered;
      document.getElementById('total-count').innerText = total;

      if (phase === "QUESTION" && total > 0 && answered === total) {
        document.getElementById('alert-box').style.display = "block";
      } else {
        document.getElementById('alert-box').style.display = "none";
      }
    });

    db.ref('game_state').set({ nodeIndex: 0, phase: 'LOBBY', currentNodeKey: 'NODE_1' });
  </script>
</body>
</html>
