<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Mobile Terminal</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070b12;
      --panel: #0f1724;
      --panel-border: #1e2c40;
      --neon-green: #00ff66;
      --neon-cyan: #00f0ff;
      --neon-red: #ff3366;
      --btn-blue: #1a73e8;
    }

    * { box-sizing: border-box; }
    body {
      background: var(--bg);
      color: #fff;
      font-family: 'Share Tech Mono', monospace;
      text-align: center;
      padding: 15px;
      margin: 0;
      min-height: 100vh;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      padding: 12px 18px;
      border-radius: 6px;
      margin-bottom: 20px;
    }

    .callsign-text { font-family: 'Orbitron', sans-serif; color: var(--neon-cyan); font-weight: bold; }
    .score-text { font-family: 'Orbitron', sans-serif; color: var(--neon-green); font-weight: bold; }

    .input-box {
      width: 100%;
      padding: 16px;
      font-size: 1.1rem;
      border-radius: 6px;
      border: 1px solid var(--panel-border);
      background: #0b111a;
      color: #fff;
      font-family: inherit;
      margin-bottom: 15px;
      text-align: center;
    }

    .btn-submit {
      font-family: 'Orbitron', sans-serif;
      background: linear-gradient(135deg, #00f0ff 0%, #0088ff 100%);
      color: #000;
      border: none;
      padding: 16px;
      font-size: 1.1rem;
      width: 100%;
      border-radius: 6px;
      font-weight: 800;
      cursor: pointer;
    }

    .grid-btns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-top: 20px;
    }

    .btn-choice {
      font-family: 'Orbitron', sans-serif;
      background: linear-gradient(145deg, #132235, #0a1320);
      border: 2px solid var(--panel-border);
      color: var(--neon-cyan);
      font-size: 2rem;
      padding: 30px 0;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      transition: all 0.1s;
    }

    .btn-choice:active {
      transform: scale(0.96);
      border-color: var(--neon-cyan);
      background: var(--btn-blue);
      color: #fff;
    }

    .status-msg {
      color: #8a9bb0;
      font-size: 1.1rem;
      margin: 25px 0;
      line-height: 1.5;
    }

    .feedback-card {
      padding: 20px;
      border-radius: 8px;
      font-family: 'Orbitron', sans-serif;
      font-size: 1.2rem;
      font-weight: bold;
      margin-top: 20px;
    }

    .feedback-pass {
      background: rgba(0, 255, 102, 0.15);
      border: 2px solid var(--neon-green);
      color: var(--neon-green);
    }

    .feedback-fail {
      background: rgba(255, 51, 102, 0.15);
      border: 2px solid var(--neon-red);
      color: var(--neon-red);
    }

    .hidden { display: none; }
  </style>
</head>
<body>

  <div id="login-ui" style="max-width: 400px; margin: 40px auto 0 auto;">
    <h1 style="font-family:'Orbitron', sans-serif; color:var(--neon-cyan); font-size:1.5rem;">AGENT TERMINAL</h1>
    <p style="color:#8a9bb0; margin-bottom: 25px;">Enter callsign to authenticate on S-6 network</p>
    <input type="text" id="username" class="input-box" placeholder="e.g., Sgt_Gunny"><br>
    <button class="btn-submit" onclick="connectTerminal()">PAIR TERMINAL</button>
  </div>

  <div id="game-ui" class="hidden">
    <div class="header-bar">
      <span id="callsign-display" class="callsign-text">AGENT</span>
      <span id="score-display" class="score-text">100 PTS</span>
    </div>

    <p id="status-display" class="status-msg">Connected to Tactical Net. Waiting for briefing...</p>

    <div id="choice-grid" class="grid-btns hidden">
      <button class="btn-choice" onclick="submitChoice('A')">A</button>
      <button class="btn-choice" onclick="submitChoice('B')">B</button>
      <button class="btn-choice" onclick="submitChoice('C')">C</button>
      <button class="btn-choice" onclick="submitChoice('D')">D</button>
    </div>

    <div id="feedback-card" class="feedback-card hidden"></div>
  </div>

  <script>
    const firebaseConfig = {
  apiKey: "AIzaSyAp-Bft2q1zwGoF6q9wMdyQkBd4BDTbnms",
  authDomain: "operation-voluntold.firebaseapp.com",
  projectId: "operation-voluntold",
  storageBucket: "operation-voluntold.firebasestorage.app",
  messagingSenderId: "373011790429",
  appId: "1:373011790429:web:a9e8af4bc05b43427c2bb4"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let playerId = "";
    let mySelectedChoice = "";

    const answerKey = {
      0: "B",
      1: "B",
      2: "A",
      3: "B",
      4: "C",
      5: "B"
    };

    function connectTerminal() {
      const name = document.getElementById('username').value.trim();
      if (!name) return;

      playerId = 'agent_' + Math.random().toString(36).substr(2, 9);
      
      const playerRef = db.ref('players/' + playerId);
      playerRef.set({
        name: name,
        score: 100,
        currentAnswer: ""
      });

      playerRef.onDisconnect().remove();

      document.getElementById('login-ui').classList.add('hidden');
      document.getElementById('game-ui').classList.remove('hidden');
      document.getElementById('callsign-display').innerText = name.toUpperCase();

      listenToGameState();
      listenToMyScore();
    }

    function listenToMyScore() {
      db.ref(`players/${playerId}/score`).on('value', (snapshot) => {
        const val = snapshot.val();
        if (val !== null) {
          document.getElementById('score-display').innerText = val + " PTS";
        }
      });
    }

    function listenToGameState() {
      db.ref('game_state').on('value', (snapshot) => {
        const state = snapshot.val() || {};
        const phase = state.phase;
        const nodeIdx = state.nodeIndex;

        const grid = document.getElementById('choice-grid');
        const feedback = document.getElementById('feedback-card');
        const status = document.getElementById('status-display');

        feedback.classList.add('hidden');

        if (phase === "LOBBY") {
          grid.classList.add('hidden');
          status.innerText = "Connected to Command. Waiting for operation start...";
        } else if (phase === "NARRATIVE") {
          grid.classList.add('hidden');
          mySelectedChoice = "";
          status.innerText = "👀 Eyes on Command Screen for Situation Briefing...";
        } else if (phase === "QUESTION") {
          if (!mySelectedChoice) {
            grid.classList.remove('hidden');
            status.innerText = "TRANSMIT TACTICAL RESPONSE:";
          } else {
            grid.classList.add('hidden');
            status.innerText = "Transmission Received. Awaiting Command Evaluation...";
          }
        } else if (phase === "REVEAL") {
          grid.classList.add('hidden');
          status.innerText = "DAMAGE ASSESSMENT IN PROGRESS";

          const correct = answerKey[nodeIdx];
          feedback.classList.remove('hidden');

          if (mySelectedChoice === correct) {
            feedback.className = "feedback-card feedback-pass";
            feedback.innerText = "🛡️ SYSTEM SECURED (+10 PTS)";
          } else if (mySelectedChoice && mySelectedChoice !== correct) {
            feedback.className = "feedback-card feedback-fail";
            feedback.innerText = "💥 SECURITY BREACH (-15 PTS)";
          } else {
            feedback.className = "feedback-card feedback-fail";
            feedback.innerText = "⚠️ NO RESPONSE TRANSMITTED (0 PTS)";
          }
        } else if (phase === "END") {
          grid.classList.add('hidden');
          status.innerText = "OPERATION COMPLETE. Review overall ranks on Main Screen.";
        }
      });
    }

    function submitChoice(choice) {
      mySelectedChoice = choice;
      db.ref(`players/${playerId}/currentAnswer`).set(choice);
      document.getElementById('choice-grid').classList.add('hidden');
      document.getElementById('status-display').innerText = "Transmission Received. Awaiting Command Evaluation...";
    }
  </script>
</body>
</html>
